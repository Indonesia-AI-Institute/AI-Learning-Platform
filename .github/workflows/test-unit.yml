name: Test Suite (Unit)

# Reusable workflow, called by test.yml, pr-validate.yml, and release.yml.
# A sibling of test-integration.yml rather than one file gated by a
# scope input — that would leave every call showing the other scope's
# jobs as permanently skipped in the checks UI.

on:
  workflow_call:

jobs:
  test-backend-unit:
    name: Backend Tests (pytest, unit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.12" # pinned, matches src/backend/Dockerfile

      - name: Sync backend dependencies
        run: uv sync --project src/backend --extra dev

      - name: Run pytest
        run: PYTHONPATH="$(pwd)/src" uv run --project src/backend pytest src/backend/tests/unit -q

  test-frontend-unit:
    name: Frontend Tests (bun test, unit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2" # pinned, matches src/frontend/Dockerfile

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: bun install --frozen-lockfile

      - name: Run bun test
        working-directory: src/frontend
        run: bun run test:unit
