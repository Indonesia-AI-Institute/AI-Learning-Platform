name: Test

# Fast feedback on every push to any branch, including main — unit tests
# only, no Postgres, no integration suite (see reusable-test.yml's
# scope=unit variant). This is separate from pr-validate.yml (full suite,
# plus a build-only Docker validation) and from release.yml's own
# post-release full-suite run (which gates the final image build) — see
# the root CLAUDE.md and the `release` skill for how the three fit
# together.

on:
  push:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    uses: ./.github/workflows/reusable-test.yml
    with:
      scope: unit
