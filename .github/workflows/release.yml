name: Release & Publish

# Push to main only. Sequence: cut a version from commit history
# (semantic-release, config at the repo-root pyproject.toml), tag + push
# + create a GitHub Release -> if a version was cut, re-run unit +
# integration against that exact commit -> only if both pass, build and
# push the versioned images to GHCR. This duplicates pr-validate.yml's
# checks deliberately: nothing enforces those passing before a merge is
# allowed (no branch protection on this repo's plan — CLAUDE.md Critical
# Rule 3), so this is the real last gate before an image ships.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # semantic-release needs this to push the tag & CHANGELOG
  packages: write # docker push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/indonesia-ai-institute/ai-learning-platform

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-semantic-release
        run: pip install python-semantic-release==9.*

      - name: Run semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `version` tags, pushes, and creates the GitHub Release in one
          # step. `publish` uploads dist assets (dist_glob_patterns is
          # currently empty — this ships Docker images, not PyPI/GitHub
          # release artifacts — so it's a no-op today, kept for later).
          semantic-release --config pyproject.toml version
          semantic-release --config pyproject.toml publish

  test-unit:
    name: Test Suite (post-release, unit)
    needs: [release]
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/test-unit.yml

  test-integration:
    name: Test Suite (post-release, integration)
    needs: [release]
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/test-integration.yml

  build-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    needs: [release, test-unit, test-integration]
    if: >-
      always() && needs.release.outputs.released == 'true' &&
      needs.test-unit.result == 'success' && needs.test-integration.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (API)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: [release, test-unit, test-integration]
    if: >-
      always() && needs.release.outputs.released == 'true' &&
      needs.test-unit.result == 'success' && needs.test-integration.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (Frontend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          # NEXT_PUBLIC_API_URL isn't a build-arg — it's resolved at
          # container runtime via window.__ENV__ (see entrypoint.sh).

  update-release-notes:
    name: Add Images to Release Notes
    runs-on: ubuntu-latest
    needs: [release, build-api, build-frontend]
    if: >-
      always() && needs.release.outputs.released == 'true' &&
      needs.build-api.result == 'success' && needs.build-frontend.result == 'success'

    steps:
      # The GitHub Release already exists (created by `semantic-release
      # version`, before the images were even built) — append the actual
      # image references now that we know the push succeeded, rather than
      # replacing the changelog-derived notes PSR already wrote.
      - name: Append image references to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${{ needs.release.outputs.version }}"
          REPO="${{ github.repository }}"
          {
            gh release view "$TAG" --repo "$REPO" --json body -q .body
            echo ""
            echo "## Images"
            echo ""
            echo "- \`${{ env.IMAGE_BASE }}-api:${VERSION}\`"
            echo "- \`${{ env.IMAGE_BASE }}-frontend:${VERSION}\`"
          } > /tmp/release-notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/release-notes.md

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release, test-unit, test-integration, build-api, build-frontend, update-release-notes]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.release.outputs.released }}" == "true" ]; then
            echo "**New release:** \`${{ needs.release.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Post-release tests:** unit=${{ needs.test-unit.result }}, integration=${{ needs.test-integration.result }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| API | \`${{ env.IMAGE_BASE }}-api:${{ needs.release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Frontend | \`${{ env.IMAGE_BASE }}-frontend:${{ needs.release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "**No release:** no commit since the last tag triggers a version bump." >> $GITHUB_STEP_SUMMARY
            echo "Use a \`feat:\`, \`fix:\`, \`perf:\`, \`refactor:\`, or \`feat!:\` commit to trigger one." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
