[project]
name = "my-backend-app"
version = "1.1.0"
description = "FastAPI backend with LLM integration"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # FastAPI core
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.22",
    # Config & settings
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "email-validator==2.3.0",
    "python-dotenv==1.2.1",
    "pyyaml==6.0.3",
    # LLM providers
    "openai==1.52.2",
    "httpx==0.27.2",
    "anthropic==0.40.0",
    # Database
    "sqlalchemy==2.0.46",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    # SSE streaming
    "sse-starlette==2.1.3",
    # Performance
    "orjson==3.11.7",
    # Security
    "python-jose==3.4.0",
    "passlib[bcrypt]==1.7.4",
    # Pinned: passlib 1.7.4's own bcrypt self-test crashes on bcrypt 5.x
    # (bcrypt now hard-rejects >72-byte inputs instead of the old silent
    # truncation passlib's probe expects) — passlib is unmaintained, so this
    # is a hard ceiling until the auth layer moves off it.
    "bcrypt==4.0.1",
    "cryptography==46.0.5",
    "python-semantic-release>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "python-semantic-release>=9.0.0",
    "ruff==0.9.6"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow to start: real bugs and import hygiene, not style.
# E/F are pycodestyle errors + pyflakes (unused imports/vars, undefined
# names, etc.); I is import sorting; B is flake8-bugbear (common
# correctness footguns — mutable default args, misused except handling).
# Widen this list later rather than starting broad and drowning the
# first run in pre-existing style violations unrelated to correctness.
select = ["E", "F", "I", "B"]
ignore = [
    "E501", # line-length is a formatter concern (ruff format), not a lint error
    # A real, sizeable backlog (74 hits on first run) — every FastAPI route/
    # service re-raising inside an `except` block without `from e`/`from
    # None` loses exception chaining. Genuine finding, not a false
    # positive like B008 below, but too large a behavioral sweep to fix
    # blindly in one pass. Re-enable and fix deliberately, file by file.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Star imports / unused-in-this-file re-exports are the norm in these.
"__init__.py" = ["F401"]
# `from backend.models import *` is deliberate here — Alembic's
# autogenerate needs every model imported so Base.metadata is fully
# populated to diff against; see the new-model skill for why this and
# models/__init__.py both matter for a new table to be detected at all.
"alembic/env.py" = ["F403"]

[tool.ruff.lint.flake8-bugbear]
# B008 (no function calls in default args) is a real bug for a mutable
# default like `[]`, but FastAPI's entire dependency-injection system is
# built on `Depends(...)`/`Query(...)`/etc. as default-argument values —
# that's the framework's own idiomatic pattern, not the bug B008 exists
# to catch. Without this, B008 fires on essentially every route.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    # This project's own callable-class dependency (role-only check, not
    # ownership — see backend CLAUDE.md Critical Rule 2), constructed
    # inline the same idiomatic way: Depends(RoleGuard([UserRole.TEACHER])).
    "backend.utils.role_guard.RoleGuard",
]


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# The app runs via PYTHONPATH + "backend.*" imports, not as an installed
# package, so uv should only install dependencies, never build/install this.
[tool.uv]
package = false


# Python Semantic Release — config resolved relative to repo root (see
# `semantic-release --config` in .github/workflows/container-build.yml)
[tool.semantic_release]
tag_format = "v{version}"
major_on_zero = false
branch = "main"
commit_parser = "angular"

version_toml = [
    "src/backend/pyproject.toml:project.version"
]

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]

patch_tags = [
    "fix",
    "perf",
    "refactor"
]

allowed_tags = [
    "feat",
    "fix",
    "perf",
    "refactor",
    "docs",
    "style",
    "test",
    "chore",
    "ci",
    "build",
    "revert"
]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = []
upload_to_vcs_release = true
