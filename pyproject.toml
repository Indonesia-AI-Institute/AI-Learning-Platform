[project]
name = "my-backend-app"
version = "0.1.0"
description = "FastAPI backend with LLM integration"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # =========================================================
    # FASTAPI CORE
    # =========================================================
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",

    # =========================================================
    # CONFIG & SETTINGS
    # =========================================================
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "pyyaml==6.0.3",

    # =========================================================
    # LLM / OPENAI
    # =========================================================
    "openai==1.52.2",
    "httpx==0.27.2",
    "anthropic==0.40.0",

    # =========================================================
    # SSE STREAMING
    # =========================================================
    "sse-starlette==2.1.3",

    # =========================================================
    # PERFORMANCE
    # =========================================================
    "orjson==3.11.7",

    # =========================================================
    # SECURITY
    # =========================================================
    "python-jose==3.3.0",
    "passlib==1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"