name: ai-learning-platform

services:

  # ===================================================
  # BACKEND API
  # ===================================================
  api:
    image: ghcr.io/indonesia-ai-institute/ai-learning-platform-api:latest
    container_name: ailearning-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - iaii-network
    command: >
      sh -c "
        echo '⏳ Running migrations...' &&
        alembic upgrade head &&
        echo '🚀 Starting API...' &&
        uvicorn src.backend.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      # Hot reload untuk development (comment out untuk production)
      # - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  # ===================================================
  # FRONTEND
  # ===================================================
  frontend:
    image: ghcr.io/indonesia-ai-institute/ai-learning-platform-frontend:latest
    container_name: ailearning-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - iaii-network

# ===================================================
# NETWORKS
# ===================================================
networks:
  iaii-network:
    name: iaii-network
    driver: bridge
