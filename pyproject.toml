[project]
name = "my-backend-app"
version = "1.0.1"
description = "FastAPI backend with LLM integration"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # =========================================================
    # FASTAPI CORE
    # =========================================================
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    # =========================================================
    # CONFIG & SETTINGS
    # =========================================================
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "pyyaml==6.0.3",
    # =========================================================
    # LLM / OPENAI
    # =========================================================
    "openai==1.52.2",
    "httpx==0.27.2",
    "anthropic==0.40.0",
    # =========================================================
    # SSE STREAMING
    # =========================================================
    "sse-starlette==2.1.3",
    # =========================================================
    # PERFORMANCE
    # =========================================================
    "orjson==3.11.7",
    # =========================================================
    # SECURITY
    # =========================================================
    "python-jose==3.3.0",
    "passlib==1.7.4",
    "python-semantic-release>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "python-semantic-release>=9.0.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


# =========================================================
# PYTHON SEMANTIC RELEASE
# =========================================================

[tool.semantic_release]
tag_format = "v{version}"

major_on_zero = false

branch = "main"

commit_parser = "angular"

# Update version pada [project]
version_toml = [
    "pyproject.toml:project.version"
]

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]

patch_tags = [
    "fix",
    "perf",
    "refactor"
]

allowed_tags = [
    "feat",
    "fix",
    "perf",
    "refactor",
    "docs",
    "style",
    "test",
    "chore",
    "ci",
    "build",
    "revert"
]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = []
upload_to_vcs_release = true
