name: ai-learning-platform

services:

  # DATABASE
  db:
    image: postgres:15-alpine
    container_name: ailearning-db
    restart: unless-stopped
    env_file:
      - .env.be
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ai-learning-net
    ports:
      - "5432:5432"
    healthcheck:
      # $$ defers expansion to the container shell (POSTGRES_* come from env_file)
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # BACKEND API
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: ghcr.io/indonesia-ai-institute/ai-learning-platform-api:latest
    container_name: ailearning-api
    restart: unless-stopped
    env_file:
      - .env.be
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides .env.be's PORT so both sides of the mapping below always
      # agree — set API_PORT in the root .env to change it.
      PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    networks:
      - ai-learning-net
    volumes:
      # Uncomment for hot reload
      # - ./src/backend:/app/backend
      - ./src/backend/alembic:/app/backend/alembic
      - ./src/backend/alembic.ini:/app/backend/alembic.ini

  # FRONTEND
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: ghcr.io/indonesia-ai-institute/ai-learning-platform-frontend:latest
    container_name: ailearning-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    networks:
      - ai-learning-net
    environment:
      # Read at container start by entrypoint.sh, not baked into the image —
      # in production, override via .env.fe instead of editing this file.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      # Overrides .env.fe's PORT so both sides of the mapping above always
      # agree — set FRONTEND_PORT in the root .env to change it.
      PORT: ${FRONTEND_PORT:-3000}

networks:
  ai-learning-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
